[workspace]
name = "gk"
version = "0.2.0"  # SemVer 2.0.0; must equal gk.__version__ and pyproject.toml
# Same channels, platforms and Python as atCGS, so both observe one environment.
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-arm64"]

[tasks]
test = "python -m pytest tests"
lint = "ruff check ."
gk = "python -m gk"

[dependencies]
python = "3.11.*"
pytest = "*"
ruff = "*"
cryptography = ">=44"
bcrypt = ">=4"

[pypi-dependencies]
gk = { path = ".", editable = true }
